<!-- SSS v.56964 (Archive Baseline) -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SSS v.56964 — Smart Safety Shield | Santo Stark Studio</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#FF2A4B">
  <link rel="icon" type="image/svg+xml" href="icon-192.svg">
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-background"></div>
  <div class="device-wrapper">
    <div class="device-frame">
      <div class="status-bar">
        <span class="status-time" id="statusTime">12:00</span>
        <div class="dynamic-island"><span class="island-dot"></span><span class="island-text" id="islandStatus">SSS Shield: 100% Active</span></div>
        <select id="globalLangPicker" class="mini-lang-picker">
          <option value="en-US">🌐 English</option>
          <option value="hi-IN">🇮🇳 Hindi</option>
          <option value="te-IN">🇮🇳 Telugu</option>
          <option value="es-ES">🇪🇸 Spanish</option>
        </select>
      </div>

      <header class="app-header">
        <div class="brand-badge">
          <div class="studio-logo">SSS</div>
          <div>
            <div class="brand-title">SMART SAFETY SHIELD</div>
            <div class="brand-sub">SANTO STARK STUDIO • v.56964 (BASELINE)</div>
          </div>
        </div>
        <div class="header-actions">
          <button class="offers-header-btn" id="openOffersBtn">🎁 OFFERS</button>
          <button class="install-header-btn" id="installAppBtn">📥 INSTALL</button>
          <button class="icon-btn" id="drillBtn">🛡️ DRILL</button>
        </div>
      </header>

      <main class="screen-content">
        <section id="tab-sos" class="tab-pane active">
          <div class="trial-active-strip"><span>🎉 <strong>30-Day Pro Trial Active:</strong> Free Delivery Fleet Rescue</span></div>
          <div class="sos-hero-container">
            <button class="big-red-button" id="sosMainBtn">
              <div class="button-inner">
                <div class="btn-shield-icon">🛡️</div>
                <div class="btn-sos-text">SSS SOS</div>
                <div class="btn-sub-text">1-TAP EMERGENCY BEACON</div>
              </div>
            </button>
          </div>
        </section>
      </main>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
